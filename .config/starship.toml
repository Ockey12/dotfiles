"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_orange)\
$os\
$directory\
[](fg:color_orange bg:color_aqua)\
$git_branch\
[](fg:color_aqua bg:color_bg1)\
${custom.git_changed_files}\
$git_metrics\
${custom.git_untracked_added}\
[](fg:color_bg1 bg:color_bg3)\
$time\
[ ](fg:color_bg3)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98d71a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[directory]
style = "fg:color_fg0 bg:color_orange"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[custom.git_changed_files]
description = "changed file count"
require_repo = true
shell = ["sh"]
when = 'git status --porcelain=v1 --untracked-files=all 2>/dev/null | grep -q .'
command = 'git status --porcelain=v1 --untracked-files=all 2>/dev/null | awk "END { print NR }"'
symbol = "Δ"
style = "fg:color_fg0 bg:color_bg1"
format = '[ $symbol$output ]($style)'

[git_metrics]
disabled = false
added_style = "fg:color_green bg:color_bg1"
deleted_style = "fg:color_red bg:color_bg1"
format = '([ +$added]($added_style))([ -$deleted]($deleted_style))'

[custom.git_untracked_added]
description = "untracked added lines excluding ignored files"
require_repo = true
when = true
command = '$HOME/.config/starship-git-untracked-added'
shell = ["bash", "--noprofile", "--norc"]
style = "fg:color_aqua bg:color_bg1"
format = '([ ++$output]($style))'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg3)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
